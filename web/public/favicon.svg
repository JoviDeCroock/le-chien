<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>
  <!-- Minimal dog silhouette — "le chien" -->
  <g fill="#7c3aed">
    <!-- Head -->
    <circle cx="16" cy="12" r="5"/>
    <!-- Left ear -->
    <path d="M11 12 L8 5 L13 9 Z"/>
    <!-- Right ear -->
    <path d="M21 12 L24 5 L19 9 Z"/>
    <!-- Body -->
    <ellipse cx="16" cy="21" rx="6" ry="4"/>
    <!-- Front legs -->
    <rect x="11" y="23" width="2.5" height="4" rx="1"/>
    <rect x="18.5" y="23" width="2.5" height="4" rx="1"/>
    <!-- Tail -->
    <path d="M22 19 Q26 14 25 11" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Eyes -->
  <circle cx="14" cy="11.5" r="1" fill="#0a0a0a"/>
  <circle cx="18" cy="11.5" r="1" fill="#0a0a0a"/>
  <!-- Nose -->
  <ellipse cx="16" cy="14" rx="1.2" ry="0.8" fill="#0a0a0a"/>
</svg>
