name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create worker config
        run: cp web/wrangler.example.jsonc web/wrangler.jsonc

      - name: Lint and format check
        run: pnpm -w run check

      - name: Typecheck Web
        run: pnpm --dir web run typecheck

      - name: Build Web
        run: pnpm --dir web run build
