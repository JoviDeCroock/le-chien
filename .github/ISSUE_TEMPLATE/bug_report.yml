name: Bug report
description: Report something that is broken or surprising.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Run `pnpm --dir web dev`
        2. Go to ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version, and relevant Cloudflare mode.
      placeholder: "Chrome 123, macOS, Node 22, local dev"
